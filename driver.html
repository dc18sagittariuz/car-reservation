<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ตารางงานพนักงานขับรถ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
/* Layout: compact header → sticky week bar (nav + 7-day strip + driver filter) → day sections of job cards. Phone-first, centered column on desktop. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
.dwrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dhead{background:linear-gradient(180deg,var(--hero-a),var(--hero-b))}
.dhead .dwrap{display:flex;align-items:center;gap:12px;padding-block:16px 10px}
.dhead svg{width:44px;height:34px;color:var(--primary);flex:none}
.dhead h1{font-size:1.3rem}
.dhead p{margin:0;color:var(--muted);font-size:.85rem}
.dbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.dbar .dwrap{display:grid;gap:10px;padding-block:10px}
.wk{display:flex;align-items:center;gap:8px}
.wk h2{flex:1;font-size:1rem;text-align:center;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 7px;display:grid;justify-items:center;gap:1px;cursor:pointer;color:var(--ink);font:inherit}
.sd small{font-size:.72rem;color:var(--muted)}
.sd b{font-family:var(--display);font-weight:500;font-size:1.1rem;line-height:1.2}
.sd .cnt{min-width:20px;height:18px;border-radius:9px;font-size:.7rem;display:grid;place-items:center;padding:0 5px;background:var(--sunk);color:var(--muted)}
.sd .cnt.has{background:var(--primary);color:var(--primary-ink);font-weight:600}
.sd .cnt.mine{background:var(--ok);color:var(--surface)}
.sd.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.flt{display:flex;gap:8px;align-items:center}
.flt label{display:flex;align-items:center;gap:8px;font-size:.88rem;white-space:nowrap;color:var(--muted)}
.flt select{flex:1;padding:7px 10px}
main.dwrap{padding-block:16px 48px;display:grid;gap:22px}
.dday h3{display:flex;align-items:baseline;gap:8px;font-size:1.05rem;margin-bottom:10px;scroll-margin-top:190px}
.dday h3 .n{font-family:var(--body);font-size:.82rem;color:var(--muted);font-weight:400}
.dday h3 .tag{font-size:.72rem;background:var(--primary);color:var(--primary-ink);padding:1px 8px;border-radius:10px;font-family:var(--body)}
.jobs{display:grid;gap:10px}
.job{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative;overflow:hidden}
.job::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--v)}
.job.mine{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.tcol{display:grid;align-content:start;gap:2px;font-variant-numeric:tabular-nums;padding-left:4px}
.tcol b{font-family:var(--display);font-weight:500;font-size:1.1rem}
.tcol span{color:var(--muted);font-size:.85rem}
.jinfo{display:grid;gap:4px;min-width:0;font-size:.92rem}
.jtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.jdest{font-family:var(--display);font-weight:500;font-size:1.05rem;overflow-wrap:anywhere}
.jdrv{font-weight:600}
.jdrv.none{color:var(--warn)}
.jsub{color:var(--muted);overflow-wrap:anywhere}
.jinfo a{color:var(--primary);text-decoration:none;font-weight:500}
.minepill{font-size:.72rem;background:var(--ok-soft);color:var(--ok);padding:1px 8px;border-radius:10px;font-weight:600}
.dempty{color:var(--muted);font-size:.9rem;padding:10px 14px;border:1.5px dashed var(--line);border-radius:12px}
.msgbox{padding:40px 20px;text-align:center;color:var(--muted)}
.upd{text-align:center;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header class="dhead"><div class="dwrap">
  <svg viewBox="0 0 72 56" aria-hidden="true"><path d="M14 24l6-13c1.2-2.6 3.6-4 6.3-4h19.4c2.7 0 5.1 1.4 6.3 4l6 13" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><rect x="5" y="22" width="62" height="22" rx="8" fill="currentColor"/><rect x="9" y="40" width="13" height="13" rx="4" fill="currentColor"/><rect x="50" y="40" width="13" height="13" rx="4" fill="currentColor"/><circle cx="17" cy="32" r="4.2" fill="var(--surface)"/><circle cx="55" cy="32" r="4.2" fill="var(--surface)"/></svg>
  <div><h1>ตารางงานพนักงานขับรถ</h1><p>ระบบจองใช้รถภายในหน่วยงาน · เฉพาะงานที่อนุมัติแล้ว</p></div>
</div></header>

<div class="dbar"><div class="dwrap">
  <div class="wk">
    <button class="iconbtn" id="prev" aria-label="สัปดาห์ก่อน">‹</button>
    <h2 id="wkTitle">กำลังโหลด…</h2>
    <button class="iconbtn" id="next" aria-label="สัปดาห์ถัดไป">›</button>
  </div>
  <div class="strip" id="strip"></div>
  <div class="flt"><label for="who">แสดงงานของ</label><select id="who"><option value="">ทุกคน</option></select><button class="btn sm" id="today">วันนี้</button></div>
</div></div>

<main class="dwrap" id="list"><div class="msgbox">กำลังโหลด…</div></main>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="driver.js"></script>
</body>
</html>
